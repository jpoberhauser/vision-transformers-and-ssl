project:
  type: website
  output-dir: _site

website:
  title: "Vision Transformers & SSL"
  description: "Hands-on course on vision transformers and self-supervised learning"
  repo-url: https://github.com/jpoberhauser/vision-transformers-and-ssl
  repo-actions: [edit, source, issue]
  page-navigation: true
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Module 1 — Transformer Foundations"
        contents:
          - module1_transformer_foundations/001_vit_from_scratch.ipynb
          - module1_transformer_foundations/002_compare_ViTs.ipynb
          - module1_transformer_foundations/002_CoAtNet.ipynb
          - module1_transformer_foundations/003_MAE.ipynb
          - module1_transformer_foundations/004_understanding_attention.ipynb
          - module1_transformer_foundations/004_linear_probing_encoders.ipynb
      - section: "Module 1 — Exercises"
        contents:
          - module1_exercises/001_vit_from_scratch_exercises.ipynb
          - module1_exercises/002_compare_ViTs_exercises.ipynb
          - module1_exercises/002_CoAtNet_exercises.ipynb
          - module1_exercises/003_MAE_exercises.ipynb
      - section: "Module 2 — Detection, Segmentation, Tracking"
        contents:
          - module2_detection_segmentation_tracking/001_detr_from_scratch.ipynb
          - module2_detection_segmentation_tracking/001_detr_from_scratch_scaffold.ipynb
          - module2_detection_segmentation_tracking/002_building_on_detr.ipynb
          - module2_detection_segmentation_tracking/002_building_on_detr_scaffold.ipynb
      - section: "Module 3 — SSL: Image & Video"
        contents:
          - module3_ssl_image_and_video/intro_to_representation_learning.ipynb
          - module3_ssl_image_and_video/intro_to_representation_learning_scaffold.ipynb
          - module3_ssl_image_and_video/v-jepa2_1.ipynb

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github

execute:
  enabled: false
